<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PAW.MinimalAPI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <!-- MENÚ -->
  <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#" onclick="show('home')">PAW.MinimalAPI</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="#" onclick="show('home')">Inicio</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="show('tasks')">Tasks</a></li>
    </ul>
    <!-- TIPO DE CAMBIO A LA DERECHA -->
    <span class="navbar-text text-white" id="tc">Tipo de cambio: cargando...</span>
  </nav>

  <main class="container mt-4">
    <section id="home">
      <h2>Bienvenido</h2>
      <p>Aplicación de ejemplo con Minimal API, Dependency Injection y CRUD de Tasks.</p>
    </section>

    <section id="tasks" style="display:none">
      <div class="d-flex justify-content-between mb-3">
        <h2>Tasks</h2>
        <button class="btn btn-primary" onclick="openForm()">Nueva tarea</button>
      </div>

      <table class="table table-striped align-middle">
        <thead>
          <tr><th>Id</th><th>Título</th><th>Descripción</th><th>Vence</th><th>Completada</th><th></th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <!-- Formulario crear/editar -->
      <div class="card p-3" id="formCard" style="display:none">
        <h5 id="formTitle">Nueva tarea</h5>
        <input type="hidden" id="taskId" />
        <div class="mb-2"><label class="form-label">Título</label><input id="title" class="form-control" /></div>
        <div class="mb-2"><label class="form-label">Descripción</label><input id="description" class="form-control" /></div>
        <div class="mb-2"><label class="form-label">Fecha límite</label><input id="dueDate" type="date" class="form-control" /></div>
        <div class="form-check mb-3"><input id="isCompleted" type="checkbox" class="form-check-input" /><label class="form-check-label">Completada</label></div>
        <div>
          <button class="btn btn-success" onclick="save()">Guardar</button>
          <button class="btn btn-secondary" onclick="closeForm()">Cancelar</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const api = '/api/tasks';

    function show(id) {
      document.getElementById('home').style.display = id === 'home' ? '' : 'none';
      document.getElementById('tasks').style.display = id === 'tasks' ? '' : 'none';
      if (id === 'tasks') loadTasks();
    }

    async function loadTipoCambio() {
      try {
        const r = await fetch('/api/tipocambio');
        if (!r.ok) throw new Error();
        const tc = await r.json();
        document.getElementById('tc').textContent = `Compra: ₡${tc.compra}  |  Venta: ₡${tc.venta}`;
      } catch {
        document.getElementById('tc').textContent = 'Tipo de cambio no disponible';
      }
    }

    async function loadTasks() {
      const data = await (await fetch(api)).json();
      document.getElementById('tbody').innerHTML = data.map(t => `
        <tr>
          <td>${t.id}</td>
          <td>${esc(t.title)}</td>
          <td>${esc(t.description ?? '')}</td>
          <td>${t.dueDate ? t.dueDate.substring(0, 10) : ''}</td>
          <td>${t.isCompleted ? '✔' : ''}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary" onclick="edit(${t.id})">Editar</button>
            <button class="btn btn-sm btn-outline-danger" onclick="remove(${t.id})">Eliminar</button>
          </td>
        </tr>`).join('');
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function openForm(t) {
      document.getElementById('formCard').style.display = '';
      document.getElementById('formTitle').textContent = t ? 'Editar tarea' : 'Nueva tarea';
      document.getElementById('taskId').value = t?.id ?? '';
      document.getElementById('title').value = t?.title ?? '';
      document.getElementById('description').value = t?.description ?? '';
      document.getElementById('dueDate').value = t?.dueDate ? t.dueDate.substring(0, 10) : '';
      document.getElementById('isCompleted').checked = t?.isCompleted ?? false;
    }
    function closeForm() { document.getElementById('formCard').style.display = 'none'; }

    async function edit(id) {
      const t = await (await fetch(`${api}/${id}`)).json();
      openForm(t);
    }

    async function save() {
      const id = document.getElementById('taskId').value;
      const body = {
        id: id ? Number(id) : 0,
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        dueDate: document.getElementById('dueDate').value || null,
        isCompleted: document.getElementById('isCompleted').checked
      };
      const res = await fetch(id ? `${api}/${id}` : api, {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) { alert(await res.text()); return; }
      closeForm();
      loadTasks();
    }

    async function remove(id) {
      if (!confirm('¿Eliminar la tarea?')) return;
      await fetch(`${api}/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    loadTipoCambio();
  </script>
</body>
</html>
